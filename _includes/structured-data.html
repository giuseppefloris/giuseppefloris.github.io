{% if page.url == '/' %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ProfilePage",
  "@id": {{ '/#profile' | absolute_url | jsonify }},
  "url": {{ '/' | absolute_url | jsonify }},
  "name": {{ page.title | jsonify }},
  "dateModified": {{ page.last_modified_at | date_to_xmlschema | jsonify }},
  "mainEntity": {
    "@type": "Person",
    "@id": {{ '/#person' | absolute_url | jsonify }},
    "name": {{ site.author.name | jsonify }},
    "givenName": "Giuseppe",
    "familyName": "Floris",
    "url": {{ '/' | absolute_url | jsonify }},
    "image": {{ '/images/profile.png' | absolute_url | jsonify }},
    "jobTitle": "PhD student in Electronics and Computer Engineering",
    "description": {{ site.description | jsonify }},
    "affiliation": {"@type": "Organization", "name": "University of Cagliari", "url": "https://www.unica.it/"},
    "sameAs": [
      {{ site.author.googlescholar | jsonify }},
      {{ site.author.orcid | jsonify }},
      {{ site.author.github | prepend: 'https://github.com/' | jsonify }},
      {{ site.author.linkedin | prepend: 'https://www.linkedin.com/in/' | append: '/' | jsonify }}
    ],
    "knowsAbout": ["Machine learning security", "Adversarial robustness", "Privacy attacks", "Differential privacy", "LLM security", "Machine learning for cybersecurity"]
  }
}
</script>
{% elsif page.collection == 'publications' %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ScholarlyArticle",
  "@id": {{ page.url | absolute_url | append: '#article' | jsonify }},
  "url": {{ page.url | absolute_url | jsonify }},
  "headline": {{ page.title | jsonify }},
  "description": {{ page.excerpt | strip_html | strip_newlines | jsonify }},
  "isPartOf": {"@type": "CreativeWork", "name": {{ page.venue | strip | jsonify }}},
  "sameAs": {{ page.paperurl | jsonify }}{% if page.authors %},
  "author": [{% for author in page.authors %}{"@type": "Person", "name": {{ author | jsonify }}{% if author == site.author.name %}, "@id": {{ '/#person' | absolute_url | jsonify }}{% endif %}}{% unless forloop.last %},{% endunless %}{% endfor %}]{% endif %}
}
</script>
<meta name="citation_title" content="{{ page.title | escape }}">
{% for author in page.authors %}<meta name="citation_author" content="{{ author | escape }}">{% endfor %}
<meta name="citation_publication_date" content="{% if page.citation_year %}{{ page.citation_year }}{% else %}{{ page.date | date: '%Y' }}{% endif %}">
{% if page.doi %}<meta name="citation_doi" content="{{ page.doi | escape }}">{% endif %}
{% endif %}
